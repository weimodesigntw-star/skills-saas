<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills QA Dashboard — 測試儀表板</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232733;
    --border: #2e3345; --text: #e4e6f0; --text2: #8b90a5;
    --green: #22c55e; --green-bg: rgba(34,197,94,.12);
    --red: #ef4444; --red-bg: rgba(239,68,68,.12);
    --yellow: #eab308; --yellow-bg: rgba(234,179,8,.12);
    --blue: #3b82f6; --blue-bg: rgba(59,130,246,.12);
    --purple: #a855f7; --purple-bg: rgba(168,85,247,.12);
    --cyan: #06b6d4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .header { background: linear-gradient(135deg, #1e2235 0%, #141726 100%); border-bottom:1px solid var(--border); padding:24px 32px; }
  .header h1 { font-size:22px; font-weight:600; letter-spacing:-.3px; }
  .header p { color:var(--text2); font-size:13px; margin-top:4px; }

  .stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; padding:24px 32px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; text-align:center; transition:transform .15s,box-shadow .15s; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .stat-value { font-size:36px; font-weight:700; }
  .stat-label { font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:.8px; margin-top:6px; }
  .stat-green .stat-value { color:var(--green); }
  .stat-red .stat-value { color:var(--red); }
  .stat-yellow .stat-value { color:var(--yellow); }
  .stat-blue .stat-value { color:var(--blue); }
  .stat-purple .stat-value { color:var(--purple); }

  .controls { padding:16px 32px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .filter-group { display:flex; gap:6px; }
  .filter-btn { background:var(--surface); border:1px solid var(--border); color:var(--text2); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; transition:all .15s; }
  .filter-btn:hover { border-color:var(--blue); color:var(--text); }
  .filter-btn.active { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); }
  .search-box { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; font-size:13px; width:220px; margin-left:auto; }
  .search-box::placeholder { color:var(--text2); }
  .search-box:focus { outline:none; border-color:var(--blue); }
  .run-btn { background:linear-gradient(135deg,#3b82f6,#2563eb); border:none; color:#fff; padding:10px 24px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; display:flex; align-items:center; gap:6px; }
  .run-btn:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(59,130,246,.4); }
  .run-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .run-btn .spinner { display:none; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; }
  .run-btn.loading .spinner { display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .content { padding:0 32px 32px; display:grid; grid-template-columns:1fr 340px; gap:20px; }

  .table-section { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .table-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .table-header h3 { font-size:15px; font-weight:600; }
  .table-header span { font-size:12px; color:var(--text2); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 16px; font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--border); background:var(--surface2); }
  td { padding:10px 16px; font-size:13px; border-bottom:1px solid rgba(46,51,69,.5); }
  tr:hover td { background:rgba(59,130,246,.04); }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge-pass { background:var(--green-bg); color:var(--green); }
  .badge-fail { background:var(--red-bg); color:var(--red); }
  .badge-skip { background:var(--yellow-bg); color:var(--yellow); }
  .badge-tier { background:var(--purple-bg); color:var(--purple); }
  .duration { color:var(--text2); font-variant-numeric:tabular-nums; }

  .side-panel { display:flex; flex-direction:column; gap:16px; }
  .panel-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
  .panel-card h3 { font-size:14px; font-weight:600; margin-bottom:14px; }

  .skill-bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .skill-bar .name { font-size:12px; width:90px; color:var(--text2); text-transform:uppercase; }
  .skill-bar .bar-bg { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
  .skill-bar .bar-fill { height:100%; border-radius:4px; transition:width .6s ease; }
  .skill-bar .bar-fill.full { background:var(--green); }
  .skill-bar .bar-fill.partial { background:var(--yellow); }
  .skill-bar .count { font-size:11px; color:var(--text2); width:40px; text-align:right; }

  .tier-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
  .tier-item:last-child { border:none; }
  .tier-name { font-size:13px; display:flex; align-items:center; gap:8px; }
  .tier-dot { width:8px; height:8px; border-radius:50%; }
  .tier-counts { font-size:12px; color:var(--text2); }

  .slowest-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(46,51,69,.5); }
  .slowest-item:last-child { border:none; }
  .slowest-name { font-size:12px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slowest-time { font-size:12px; color:var(--cyan); font-weight:600; font-variant-numeric:tabular-nums; }

  .progress-ring { position:relative; width:120px; height:120px; margin:0 auto 16px; }
  .progress-ring svg { transform:rotate(-90deg); }
  .progress-ring .bg { fill:none; stroke:var(--surface2); stroke-width:8; }
  .progress-ring .fg { fill:none; stroke:var(--green); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .8s ease; }
  .progress-ring .label { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .progress-ring .pct { font-size:24px; font-weight:700; color:var(--green); }
  .progress-ring .sub { font-size:10px; color:var(--text2); }

  .live-log { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin:0 32px 32px; overflow:hidden; display:none; }
  .live-log.visible { display:block; }
  .live-log .log-header { padding:12px 20px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .live-log .log-header .pulse { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .log-body { padding:16px 20px; max-height:240px; overflow-y:auto; font-family:'SF Mono',Menlo,Consolas,monospace; font-size:12px; line-height:1.8; color:var(--text2); }
  .log-body .pass { color:var(--green); }
  .log-body .fail { color:var(--red); }
  .log-body .skip { color:var(--yellow); }
  .log-body .info { color:var(--blue); }

  .footer { padding:16px 32px; text-align:center; font-size:11px; color:var(--text2); border-top:1px solid var(--border); }
</style>
</head>
<body>

<div class="header">
  <h1>Skills QA Dashboard</h1>
  <p>Professional Automated Testing Framework — 4 Tiers · 7 Skills · 57 Tests</p>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="controls">
  <div class="filter-group" id="tierFilters">
    <button class="filter-btn active" data-tier="all">All</button>
    <button class="filter-btn" data-tier="1">Tier 1 · Unit</button>
    <button class="filter-btn" data-tier="2">Tier 2 · Integration</button>
    <button class="filter-btn" data-tier="3">Tier 3 · Stress</button>
    <button class="filter-btn" data-tier="4">Tier 4 · Regression</button>
  </div>
  <div class="filter-group" id="statusFilters">
    <button class="filter-btn active" data-status="all">All Status</button>
    <button class="filter-btn" data-status="passed">Passed</button>
    <button class="filter-btn" data-status="failed">Failed</button>
    <button class="filter-btn" data-status="skipped">Skipped</button>
  </div>
  <input type="text" class="search-box" id="searchBox" placeholder="Search tests...">
  <button class="run-btn" id="runBtn" onclick="simulateRun()">
    <span class="spinner"></span>
    <span class="label">Re-Run All Tests</span>
  </button>
</div>

<div class="live-log" id="liveLog">
  <div class="log-header"><div class="pulse"></div> Live Test Output</div>
  <div class="log-body" id="logBody"></div>
</div>

<div class="content">
  <div class="table-section">
    <div class="table-header">
      <h3>Test Results</h3>
      <span id="tableCount">57 tests</span>
    </div>
    <table>
      <thead><tr><th>Test Name</th><th>Skill</th><th>Tier</th><th>Status</th><th>Duration</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="side-panel">
    <div class="panel-card">
      <h3>Pass Rate</h3>
      <div class="progress-ring" id="progressRing"></div>
    </div>
    <div class="panel-card">
      <h3>By Skill</h3>
      <div id="skillBars"></div>
    </div>
    <div class="panel-card">
      <h3>By Tier</h3>
      <div id="tierBreakdown"></div>
    </div>
    <div class="panel-card">
      <h3>Slowest Tests</h3>
      <div id="slowestTests"></div>
    </div>
  </div>
</div>

<div class="footer">Skills QA Framework v1.0 · Built for Cowork Skills Validation · Last run: <span id="lastRun"></span></div>

const tierNames = {"1":"Unit","2":"Integration","3":"Stress","4":"Regression"};
const tierColors = {"1":"#3b82f6","2":"#a855f7","3":"#f97316","4":"#06b6d4"};
const skillColors = {"docx":"#3b82f6","xlsx":"#22c55e","pptx":"#f97316","pdf":"#ef4444","skill_creator":"#a855f7","stress":"#eab308","regression":"#06b6d4"};

let currentTier = "all", currentStatus = "all", searchTerm = "";

function init() {
  renderStats();
  renderProgressRing();
  renderSkillBars();
  renderTierBreakdown();
  renderSlowest();
  renderTable();
  bindFilters();
  document.getElementById("lastRun").textContent = new Date().toLocaleString("zh-TW");
}

function renderStats() {
  const s = DATA.summary;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-card stat-blue"><div class="stat-value">${s.total}</div><div class="stat-label">Total Tests</div></div>
    <div class="stat-card stat-green"><div class="stat-value">${s.passed}</div><div class="stat-label">Passed</div></div>
    <div class="stat-card stat-red"><div class="stat-value">${s.failed}</div><div class="stat-label">Failed</div></div>
    <div class="stat-card stat-yellow"><div class="stat-value">${s.skipped}</div><div class="stat-label">Skipped</div></div>
    <div class="stat-card stat-purple"><div class="stat-value">${(s.pass_rate*100).toFixed(1)}%</div><div class="stat-label">Pass Rate</div></div>
  `;
}

function renderProgressRing() {
  const pct = DATA.summary.pass_rate * 100;
  const r = 50, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  document.getElementById("progressRing").innerHTML = `
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle class="bg" cx="60" cy="60" r="${r}"/>
      <circle class="fg" cx="60" cy="60" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="label"><div class="pct">${pct.toFixed(1)}%</div><div class="sub">${DATA.summary.passed}/${DATA.summary.total}</div></div>
  `;
}

function renderSkillBars() {
  let html = "";
  for (const [name, d] of Object.entries(DATA.by_skill)) {
    const pct = (d.passed / d.total) * 100;
    const cls = pct === 100 ? "full" : "partial";
    html += `<div class="skill-bar"><span class="name">${name}</span><div class="bar-bg"><div class="bar-fill ${cls}" style="width:${pct}%;background:${skillColors[name]||'var(--green)'}"></div></div><span class="count">${d.passed}/${d.total}</span></div>`;
  }
  document.getElementById("skillBars").innerHTML = html;
}

function renderTierBreakdown() {
  let html = "";
  for (const [tier, d] of Object.entries(DATA.by_tier)) {
    html += `<div class="tier-item"><div class="tier-name"><span class="tier-dot" style="background:${tierColors[tier]}"></span>Tier ${tier} · ${tierNames[tier]}</div><div class="tier-counts">${d.passed}/${d.total} passed</div></div>`;
  }
  document.getElementById("tierBreakdown").innerHTML = html;
}

function renderSlowest() {
  const sorted = [...DATA.tests].sort((a,b) => b.duration_sec - a.duration_sec).slice(0,7);
  let html = "";
  for (const t of sorted) {
    html += `<div class="slowest-item"><span class="slowest-name" title="${t.name}">${t.name.replace(/^test_/,'')}</span><span class="slowest-time">${t.duration_sec.toFixed(3)}s</span></div>`;
  }
  document.getElementById("slowestTests").innerHTML = html;
}

function renderTable() {
  const filtered = DATA.tests.filter(t => {
    if (currentTier !== "all" && t.tier !== currentTier) return false;
    if (currentStatus !== "all" && t.status !== currentStatus) return false;
    if (searchTerm && !t.name.toLowerCase().includes(searchTerm) && !t.skill.toLowerCase().includes(searchTerm) && !t.class.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
  let html = "";
  for (const t of filtered) {
    const statusCls = t.status === "passed" ? "badge-pass" : t.status === "failed" ? "badge-fail" : "badge-skip";
    const errorTip = t.error ? ` title="${t.error}"` : "";
    html += `<tr${errorTip}><td>${t.name}<br><small style="color:var(--text2)">${t.class}</small></td><td><span style="color:${skillColors[t.skill]||'var(--text)'}">${t.skill}</span></td><td><span class="badge badge-tier" style="background:${tierColors[t.tier]}22;color:${tierColors[t.tier]}">T${t.tier} ${tierNames[t.tier]}</span></td><td><span class="badge ${statusCls}">${t.status}</span></td><td class="duration">${t.duration_sec.toFixed(3)}s</td></tr>`;
  }
  document.getElementById("tbody").innerHTML = html || '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text2)">No matching tests</td></tr>';
  document.getElementById("tableCount").textContent = `${filtered.length} tests`;
}

function bindFilters() {
  document.querySelectorAll("#tierFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tierFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTier = btn.dataset.tier;
      renderTable();
    });
  });
  document.querySelectorAll("#statusFilters .filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#statusFilters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStatus = btn.dataset.status;
      renderTable();
    });
  });
  document.getElementById("searchBox").addEventListener("input", e => {
    searchTerm = e.target.value.toLowerCase();
    renderTable();
  });
}

function simulateRun() {
  const btn = document.getElementById("runBtn");
  const log = document.getElementById("liveLog");
  const logBody = document.getElementById("logBody");
  btn.classList.add("loading");
  btn.disabled = true;
  btn.querySelector(".label").textContent = "Running...";
  log.classList.add("visible");
  logBody.innerHTML = "";

  const tests = [...DATA.tests];
  let i = 0;
  const interval = setInterval(() => {
    if (i >= tests.length) {
      clearInterval(interval);
      logBody.innerHTML += `<div class="info">\\n=== All ${tests.length} tests completed ===</div>`;
      logBody.innerHTML += `<div class="pass">Result: ${DATA.summary.passed} passed, ${DATA.summary.failed} failed, ${DATA.summary.skipped} skipped (${(DATA.summary.pass_rate*100).toFixed(1)}%)</div>`;
      btn.classList.remove("loading");
      btn.disabled = false;
      btn.querySelector(".label").textContent = "Re-Run All Tests";
      logBody.scrollTop = logBody.scrollHeight;
      return;
    }
    const t = tests[i];
    const cls = t.status === "passed" ? "pass" : t.status === "failed" ? "fail" : "skip";
    const icon = t.status === "passed" ? "\u2713" : t.status === "failed" ? "\u2717" : "\u25CB";
    logBody.innerHTML += `<div class="${cls}">${icon} ${t.skill}::${t.name} (${t.duration_sec.toFixed(3)}s)${t.error ? ' — '+t.error : ''}</div>`;
    logBody.scrollTop = logBody.scrollHeight;
    i++;
  }, 80);
}

init();
</script>
</body>
</html>
